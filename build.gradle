// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    dependencies {
        // AGP 9 has built-in Kotlin (bundles an older KGP); this raises it to the latest Kotlin
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.60.1'
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.10.2"
    }
}

plugins {
    id 'com.android.application' version '9.5.1' apply false
    id 'com.android.library' version '9.5.1' apply false
    id 'com.google.devtools.ksp' version '2.3.14' apply false
}
